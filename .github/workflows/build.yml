name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Python/requirements.txt

      - name: Install worker dependencies
        run: python -m pip install -r Python\requirements.txt

      - name: Validate Python worker
        shell: pwsh
        run: |
          python -m py_compile Python\faster_whisper_worker.py
          $response = '{"command":"ping"}' | python -u Python\faster_whisper_worker.py
          if ($response -notmatch '"ok":true') { throw "Worker health check failed: $response" }

      - name: Build YenSTT
        run: dotnet build YenSTT.csproj -c Release --warnaserror
