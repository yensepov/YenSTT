name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Python/requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:YENSTT_PYTHON = (Get-Command python).Source
          .\scripts\build-release.ps1 -Version $version

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/YenSTT-Setup-*.exe
            artifacts/release/YenSTT-*-portable.zip
            artifacts/release/SHA256SUMS.txt
