name: Feature request
description: Предложить улучшение YenSTT
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает предложение
      description: Опишите сценарий пользователя, а не только желаемую реализацию.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие другие варианты вы рассматривали?
  - type: checkboxes
    id: privacy
    attributes:
      label: Приватность
      options:
        - label: Предложение сохраняет локальную обработку аудио и текста.
          required: true
